# H2 In-Memory Datenbank für lokale Entwicklung
spring.datasource.url=jdbc:h2:mem:familiendb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2-Konsole erreichbar unter http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway in dev deaktiviert (ddl-auto übernimmt Schema-Erstellung)
spring.flyway.enabled=false

server.port=8080
logging.level.com.familienorganizer=DEBUG
logging.level.org.springframework.web=DEBUG
