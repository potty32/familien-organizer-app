# Basis-Konfiguration (gilt für alle Profile)
spring.application.name=familien-organizer

# Actuator: nur Health-Endpoint nach außen
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Jackson: ISO-8601-Datumsformat
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Berlin

# Validierungs-Fehlermeldungen auf Deutsch
spring.mvc.locale=de_DE
