# Railway injiziert SPRING_DATASOURCE_* als Umgebungsvariablen
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway verwaltet Schema-Migrationen in Prod
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Railway stellt den Port als Umgebungsvariable bereit
server.port=${PORT:8080}

# CORS: Frontend-URL als Umgebungsvariable (Railway Frontend-Service-URL)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}

logging.level.root=WARN
logging.level.com.familienorganizer=INFO
